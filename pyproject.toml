[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lombada-eletronica"
description = "Medicao de velocidade e leitura de placa por video para lombada eletronica"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# O nucleo (geometria, velocidade, votacao de placa, configuracao, banco) roda
# so com numpy e PyYAML. Cada peca pesada e um extra, para que a bancada e a
# CI nao precisem de GPU nem de download de modelo.
video = ["opencv-python-headless>=4.9,<5"]

# ATENCAO AO NOME DA DISTRIBUICAO. Existem DUAS que instalam o modulo `cv2`:
# `opencv-python` e `opencv-python-headless`. Pinar uma NAO restringe a outra
# -- para o pip sao pacotes sem relacao nenhuma.
#
# Foi assim que o OpenCV 5.0 entrou aqui em 2026-09-04, apesar de o extra
# `video` ja pinar `<5`: tanto o `ultralytics` (`opencv-python>=4.7.0`) quanto
# o `rapidocr` (`opencv_python>=4.5.1.48`) declaram a variante NAO-headless,
# sem teto de versao. O mesmo caminho ja tinha derrubado a decodificacao RTSP
# de um parque de cameras em julho.
#
# Por isso todo extra que puxa esses pacotes repete o pin na variante certa.
# `tests/test_ambiente.py` guarda a regra.
detect = ["ultralytics>=8.3", "opencv-python>=4.9,<5"]
lpr = [
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
    "opencv-python>=4.9,<5",
    "opencv-python-headless>=4.9,<5",
]
lpr-trocr = ["transformers>=4.44", "torch>=2.2", "pillow>=10.0"]
lpr-fastplate = ["fast-plate-ocr>=1.0", "open-image-models>=0.3"]
gpu = ["onnxruntime-gpu>=1.18"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
lombada = "lombada.cli:main"

[tool.hatch.version]
path = "src/lombada/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lombada"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Sem `python_version` fixo de proposito: prende-lo em 3.11 faz o mypy engasgar
# nos stubs do numpy quando o interpretador e 3.12.
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
